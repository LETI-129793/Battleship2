# 129785 - Nome do Aluno
name: Qodana smell gate 129785

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # Quality gate nativo do Qodana (failThreshold: 0 em qodana-129785.yaml)
      - uses: JetBrains/qodana-action@v2026.2
        with:
          args: --config qodana-129785.yaml
          use-annotations: true
          post-pr-comment: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
